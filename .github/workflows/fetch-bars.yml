name: Fetch price history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "years of daily history"
        default: "9"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_bars.py --years "${{ github.event.inputs.years || '9' }}"
      - name: Publish to a temporary branch (research cache, not part of main)
        run: |
          git config user.name "newsbot"; git config user.email "newsbot@users.noreply.github.com"
          git checkout --orphan bars-cache
          git rm -rf . >/dev/null 2>&1 || true
          git add -f bars_cache/bars.json.gz
          git commit -m "price history cache"
          git push -f origin bars-cache
