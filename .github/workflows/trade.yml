name: NewsBot trading session

on:
  schedule:            # UTC. סשן ראשון ב-8:00 ET (חדשות לפני הפתיחה), והעברת שרביט ב-14:10 ET. מכסה שעון קיץ/חורף; הבוט בודק מול Alpaca
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "10 18 * * 1-5"
    - cron: "10 19 * * 1-5"
    # GitHub drops/delays scheduled runs (Mon 2026-11-02 had none during the US session), so add several off-peak backups.
    # A new run just queues behind a running session (concurrency group) and exits at once if the market is closed.
    - cron: "7 12 * * 1-5"
    - cron: "41 13 * * 1-5"
    - cron: "23 14 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 15 * * 1-5"
    - cron: "37 16 * * 1-5"
    - cron: "0 */6 * * *"      # קריפטו 24/7
  workflow_dispatch:
    inputs:
      stock_only:
        description: "true = only the stock job (used by the self-chaining dispatch)"
        default: "false"

permissions:
  contents: write
  actions: write

jobs:
  trade:
    if: github.event.schedule != '0 */6 * * *'
    concurrency:
      group: newsbot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUTF8: "1"
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Trading session (paper)
        run: python bot.py --session
      - name: Save journal and state
        if: always()
        run: bash scripts/save_data.sh "journal update"
      - name: Keep the stock session going while the market is open
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub drops/delays scheduled runs, so the session chains itself: if the market is still open, start the next one.
          open=$(curl -s -H "APCA-API-KEY-ID: $ALPACA_KEY_ID" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" https://paper-api.alpaca.markets/v2/clock | python3 -c "import sys,json; print(json.load(sys.stdin).get('is_open'))" 2>/dev/null || echo False)
          ran=$(( $(date +%s) - T0 ))
          echo "market open: $open, this run lasted ${ran}s"
          if [ "$open" = "True" ] && [ "$ran" -gt 600 ]; then      # the >10 min guard stops a crash loop
            gh api -X POST repos/${{ github.repository }}/actions/workflows/trade.yml/dispatches -f ref=main -f 'inputs[stock_only]=true'
          fi

  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: newsbot-crypto
      cancel-in-progress: false
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.stock_only != 'true') || github.event.schedule == '0 */6 * * *'
    env:
      PYTHONUTF8: "1"
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Start a stock session if the market is open or opens within 90 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=$(curl -s -H "APCA-API-KEY-ID: $ALPACA_KEY_ID" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" https://paper-api.alpaca.markets/v2/clock | python3 -c "
          import sys, json
          from datetime import datetime
          c = json.load(sys.stdin)
          t = lambda x: datetime.fromisoformat(x)
          print(bool(c.get('is_open')) or (t(c['next_open']) - t(c['timestamp'])).total_seconds() < 5400)" 2>/dev/null || echo False)
          echo "start stock session: $go"
          if [ "$go" = "True" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/trade.yml/dispatches -f ref=main -f 'inputs[stock_only]=true'
          fi
      - name: Crypto session (paper)
        run: python crypto.py --session --minutes 340
      - name: Save crypto journal and state
        if: always()
        run: bash scripts/save_data.sh "crypto journal update"
