name: NewsBot trading session

on:
  schedule:            # UTC. כיסוי לשעון קיץ/חורף של ארה"ב; הבוט עצמו בודק מול Alpaca אם השוק פתוח
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "10 19 * * 1-5"
    - cron: "10 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUTF8: "1"
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Trading session (paper)
        run: python bot.py --session
      - name: Save journal and state
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add data
          git commit -m "journal update [skip ci]" || exit 0
          git pull --rebase
          git push
