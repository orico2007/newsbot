name: Backtest patterns

on:
  schedule:
    - cron: "30 2 * * 0"     # פעם בשבוע, ביום ראשון
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python backtest.py --years 3
      - name: Save results
        run: bash scripts/save_data.sh "backtest results"
