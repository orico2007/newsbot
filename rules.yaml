# ===== חוקי הבוט =====
# [V] = מהסרטון   [A] = נוסף על ידי (שיטות מקובלות לניהול סיכון)
mode: paper            # הבוט מסרב לעבוד על חשבון אמיתי אלא אם mode: live וגם ALLOW_LIVE=1

entry:
  min_score: 9               # [V] "ציון מעל 8 -> קונים" (כלומר 9 או 10)
  direction: bullish         # [A] long בלבד
  max_news_age_minutes: 15   # [A] לא מגיבים לחדשות ישנות
  min_price: 5               # [A] בלי מניות פניני
  min_avg_daily_dollar_volume: 5000000   # [A] נזילות מינימלית
  max_chase_pct: 6           # [A] לא רודפים: אם המניה כבר עלתה יותר מזה מאתמול - מדלגים

risk:
  max_position_pct: 5        # [V] "עד 5% מהחשבון" לפוזיציה
  stop_loss_pct: 3           # [V] "ירידה של 3% -> מוכרים" (פקודת סטופ אצל הברוקר)
  take_profit_pct: 6         # [A] יחס סיכוי/סיכון 2:1
  max_open_positions: 5      # [A]
  max_daily_loss_pct: 2      # [A] הפסד יומי מעל זה = הבוט עוצר לשאר היום
  max_trades_per_day: 10     # [A]
  market_hours_only: true    # [A]
