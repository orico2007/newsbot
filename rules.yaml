# ===== חוקי הבוט (v3) =====
# [V] = מהסרטון   [A] = נוסף על ידי
mode: paper            # הבוט מסרב לעבוד על חשבון אמיתי אלא אם mode: live וגם ALLOW_LIVE=1

account:
  max_open_positions_total: 12
  max_gross_exposure_pct: 90     # [A] סך החשיפה (לונג+שורט) עד 60% מההון
  max_daily_loss_pct: 2          # [A] הפסד יומי מעל זה = עוצר לשאר היום
  max_trades_per_day: 12
  market_hours_only: true

news:
  max_news_age_minutes: 15       # [A]
  min_price: 5                   # [A]
  min_avg_daily_dollar_volume: 1000000   # [A] נמדד על IEX בלבד (~3% מהמחזור האמיתי)
  max_chase_pct: 6               # [A] לא רודפים: כבר זז יותר מזה מאתמול

# ---------- מסחר יומי: נכנסים על חדשות חזקות, יוצאים לפני הסגירה ----------
day:
  enabled: true
  min_score: 9                   # [V] "ציון מעל 8"
  allow_short: true
  max_positions: 3
  flatten_minutes_before_close: 10
  long:  {position_pct: 5,   stop_pct: 3, take_profit_pct: 6}   # [V] 5% לפוזיציה, סטופ 3%
  short: {position_pct: 3,   stop_pct: 3, take_profit_pct: 6}
  chart:
    require_vwap_side: true      # לונג רק מעל VWAP, שורט רק מתחתיו
    min_rel_volume: 1.5          # זינוק נפח מול ממוצע 20 הברים הקודמים (כשיש מספיק ברים)
    max_rsi_long: 80
    min_rsi_short: 20

# ---------- סווינג: מחזיקים ימים עד שבועות ----------
swing:
  enabled: true
  catalyst_min_score: 8          # חדשות/דוח עם horizon=swing
  allow_short: false            # backtest: swing shorts lose (PF 0.69) even with market+sector filters
  max_positions: 12
  mr:                            # mean-reversion longs (mr.py): PF ~1.4-1.5, win ~65% in 2021-2026 backtest; bull market only
    enabled: true
    new_per_day: 4
    size_mult: 2.5               # x4% = 10% of equity per trade (backtest: 10% x 12 positions)
    hold_days: 7
    stop_atr: 4.0
  max_hold_days: 10              # יציאת זמן (ימי מסחר)
  scan_minutes_before_close: 15  # פריצות סווינג נבדקות רק 15 דקות לפני הסגירה, כשהנר היומי כמעט סופי
  long:  {position_pct: 4,   atr_stop_mult: 2, atr_target_mult: 4, max_stop_pct: 12}
  short: {position_pct: 2.5, atr_stop_mult: 2, atr_target_mult: 4, max_stop_pct: 8}
  scan:                          # סריקה יומית של רשימת מעקב: מגמה + נסיגה + צמיחה בדוחות
    enabled: true
    new_per_day: 2
    min_revenue_yoy_pct: 10      # צמיחת הכנסות שנתית מינימלית (דוחות SEC)
    rsi_min: 40
    rsi_max: 65
    min_pullback_pct: 2
    max_pullback_pct: 10
  watchlist: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, AMD, NFLX, CRM, ADBE, ORCL, INTC, QCOM, MU,
              UBER, SHOP, PANW, CRWD, NOW, INTU, AMAT, LRCX, JPM, V, MA, UNH, LLY, COST, WMT, HD, NKE, DIS,
              BA, CAT, GE, XOM, ABBV, ISRG]

# ---------- v3: סיגנלים מגרף (תבניות), שוק וסקטורים ----------
market:                          # Top-Down: משטר S&P500 + סקטורים מובילים/נחלשים
  enabled: true
  top_n: 3
  veto_against: true             # לא קונים סקטור חלש / לא שורטים סקטור מוביל / לא קונים בשוק דובי
  kill_switch:                   # עוצר כניסות חדשות ביום קיצוני (נבדק כל 5 דקות)
    enabled: true
    spy_drop_pct: 2.0            # S&P ירד 2% מהסגירה הקודמת = בלי לונגים חדשים
    spy_rally_pct: 3.0           # עלה 3% = בלי שורטים חדשים
    vixy_spike_pct: 10.0         # זינוק של 10% בתנודתיות = בלי לונגים חדשים
    extreme_move_pct: 5.0        # תנועה של 5% לשני הכיוונים = עוצרים הכל

signals:                         # אין יחס סיכוי-סיכון מינימלי; סטופ ויעד נגזרים ממבנה הגרף
  swing:
    enabled: true
    min_confluence: 45
    min_tools: 3                 # כלל המחברת: לפחות 3 כלים בגרף (תבנית=2, פריצה=1, נפח=1, דגל=1, ...)
    scan_watchlist_patterns: true
    use_actives: true            # + המניות הפעילות ביותר היום
    max_universe: 120
    detectors: {}                # רשימת גלאים לכיבוי: {flag: false} וכו'
  day:
    enabled: true
    min_confluence: 45
    min_tools: 3
    use_movers: true
    use_actives: true
    max_symbols: 40
    scan_every_minutes: 5
    detectors: {}
  size_multiplier: {min: 0.5, max: 1.5}    # ציון מפגש גבוה = פוזיציה גדולה יותר (עדיין מתחת לתקרות)

trailing:                        # ניהול פוזיציה פתוחה: ברייק-אבן וטריילינג
  enabled: true
  breakeven_atr: 1.0             # אחרי רווח של 1 ATR מעבירים סטופ לכניסה
  trail_atr: 2.5                 # אחרי 2 ATR רווח - סטופ נגרר 2.5 ATR מתחת לשיא
  trail_activate_atr: 2.0

research:                        # תוצרי research.py (walk-forward). כבוי: ב-holdout ה-whitelist לא שיפר את התשואה לעסקה (ראה data/research.md)
  enforce: false
  min_validated: 5               # whitelist פעיל רק כשיש לפחות 5 תבניות מאומתות (אחרת חוזרים לכיבוי לפי ה-backtest)

scale_out:                       # מימוש רווח חלקי + סטופ מוצמד לנמוך הבא אחרי כל יעד
  enabled: true
  levels: [{r: 1.0, pct: 33}, {r: 2.0, pct: 33}]    # ב-1R מוכרים 33%, ב-2R עוד 33%, השאר רץ ליעד/סטופ מבני
  min_remaining: 1
  structure_trail: true          # אחרי יעד ראשון: הסטופ עולה לכל נמוך חדש (שיא יורד בשורט)

cooldown_minutes: 90             # אחרי יציאה לא נכנסים שוב לאותה מניה

sector_cap: 2                    # מקסימום פוזיציות באותו סקטור

# ---------- קריפטו 24/7 (לונג בלבד) ----------
crypto:
  enabled: true
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, LINK/USD, DOGE/USD, LTC/USD, BCH/USD]
  position_pct: 3
  max_positions: 3
  max_gross_pct: 10
  atr_stop_mult: 2.5
  max_stop_pct: 10
  max_hold_days: 14
  trail: {activate_atr: 1.5, trail_atr: 2.5}
  min_confluence: 45
  new_per_scan: 1
  scan_every_minutes: 60
  news_min_score: 8
  news_max_age_minutes: 15

earnings:                        # לוח דוחות (Nasdaq). לא ידוע = לא חוסם
  blackout_days: 2               # סווינג לא נכנס אם יש דוח בתוך 2 ימי מסחר
  exit_before: true              # סווינג פתוח נסגר ביום שלפני הדוח

premarket:                       # חדשות ודוחות שיצאו לפני הפתיחה: מדורגים מוקדם ונכנסים בפתיחה
  enabled: true
  window_minutes: 100
  news_lookback_minutes: 600
  retry_minutes_after_open: 20
